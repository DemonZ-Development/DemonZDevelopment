<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    
    <!-- Accent Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Logo Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circular Shield -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="210" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="8 8" />

  <!-- Stylized Monogram "D" in the center -->
  <path d="M190 150 
           H280 
           C350 150, 390 190, 390 256 
           C390 322, 350 362, 280 362 
           H190 
           Z" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="18" 
        stroke-linejoin="round" />

  <path d="M230 190 
           H270 
           C310 190, 340 215, 340 256 
           C340 297, 310 322, 270 322 
           H230 
           Z" 
        fill="url(#letterGrad)" />
</svg>